[project]
name = "playground-backend"
version = "0.1.0"
description = "Forge Playground Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    # Parser libraries
    "docling>=1.0.0",
    "chandra-ocr>=0.1.0",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    # Chandra dependencies
    "transformers>=4.30.0",
    "torch>=2.0.0",
    # Queue/Worker
    "rq>=1.15.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "application", "core", "infrastructure", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
